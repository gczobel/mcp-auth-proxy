name: E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  playwright:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: e2e/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build stdio fixture server
        run: go build -o e2e/bin/testserver ./pkg/backend/testserver

      - name: Build and start proxy stack
        run: |
          docker compose -f e2e/docker-compose.yml build proxy
          docker compose -f e2e/docker-compose.yml up -d

      - name: Run Playwright e2e
        working-directory: e2e/playwright
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: e2e/playwright/test-results/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v
