name: E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  smoke:
    name: Compose e2e smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Run compose e2e smoke
        run: ./e2e/smoke.sh
